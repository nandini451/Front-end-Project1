  <script>


let checkboxes = document.querySelectorAll('input[type="checkbox"]');

let selectedItems = document.getElementById("selectedItems");

let itemCount = document.getElementById("itemCount");

let totalPrice = document.getElementById("totalPrice");

checkboxes.forEach(box => {

    box.addEventListener("change", updateSummary);

});

function updateSummary(){

    selectedItems.innerHTML = "";

    let count = 0;

    let total = 0;

    checkboxes.forEach(box => {

        if(box.checked){

            count++;

            let li = document.createElement("li");

            li.innerHTML = box.value;

            selectedItems.appendChild(li);

            total += Number(box.dataset.price);

        }

    });

    itemCount.innerHTML = "Total Items: " + count;

    totalPrice.innerHTML = "Total Price: ₹" + total;

}



document.getElementById("submitBtn").addEventListener("click", function(e){

    e.preventDefault();

    let checked = document.querySelectorAll('input[type="checkbox"]:checked');

    if(checked.length === 0){

        alert("Please select at least one item 🍽️");

    }

    else{

        alert("Menu submitted successfully 🎉");

    }

});

  </script>
